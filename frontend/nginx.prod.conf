# Configuração de PRODUÇÃO do Nginx do frontend — termina TLS (HTTPS). (issue #1)
#
# Usada apenas quando se sobe com o overlay de produção:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (o DEV continua usando frontend/nginx.conf, só HTTP na 5173).
#
# Espera os certificados montados em /etc/nginx/certs:
#   - fullchain.pem  (certificado + cadeia)
#   - privkey.pem    (chave privada)
# Em DEV/staging gere self-signed com scripts/generate-dev-certs.sh; em VPS use
# Let's Encrypt (certbot); em AWS, prefira terminar TLS no CloudFront/ALB (ver DEPLOY-HTTPS.md).

# --- HTTP (80): desafio ACME + redirect para HTTPS ---
server {
    listen 80;
    server_name _;

    # Deixa o certbot (Let's Encrypt http-01) validar o domínio ANTES do redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo o resto vai para HTTPS (301 permanente).
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (443): terminação TLS + app ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS moderno: só 1.2/1.3, ciphers seguros, sessões reaproveitadas.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: força HTTPS por 1 ano (inclui subdomínios). Só ative depois de confirmar
    # que TODO o tráfego funciona em HTTPS — uma vez enviado, o navegador recusa HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API → backend (mesma origem para o navegador, evita CORS)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme = "https" aqui → o backend (forward-headers-strategy) sabe que é seguro.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rotas do React caem no index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
